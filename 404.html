<style>
  :root{--paper:#F6F8FB;--ink:#14202F;--muted:#5C6B7E;--navy:#0D1A2E;--petrol:#0E6F68;
    /* Typo-Skala: sieben Stufen, mehr nicht */
    --fs-1:0.8125rem;   /* Label, Eyebrow, Fussnote */
    --fs-2:0.9375rem;   /* Nebentext */
    --fs-3:1.0625rem;   /* Fliesstext */
    --fs-4:1.25rem;   /* Hervorhebung, kleine Ueberschrift */
    --fs-5:1.625rem;   /* H3 */
    --fs-6:2.125rem;   /* H2 */
    --fs-7:2.875rem;   /* H1 */
  }
  @media (prefers-color-scheme:dark){:root{--paper:#0B1420;--ink:#E7EDF3;--muted:#93A3B4;--navy:#060E18;--petrol:#5FD3C4}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
       font-family:"Libre Franklin","Libre Franklin Fallback","Helvetica Neue",Arial,sans-serif;font-size:var(--fs-3);line-height:1.6;padding:32px}
  .box{max-width:520px;text-align:left}
  .mark{width:44px;height:44px;margin-bottom:26px;
        background:url("/img/signet-navy.svg") center/contain no-repeat}
  @media (prefers-color-scheme:dark){.mark{background-image:url("/img/signet-petrol.svg")}}
  h1{font-family:"Source Serif 4","Source Serif Fallback",Georgia,serif;font-weight:600;font-size:var(--fs-6);line-height:1.15;margin:0 0 14px}
  p{color:var(--muted);margin:0 0 24px}
  a.btn{display:inline-block;background:var(--petrol);color:#fff;text-decoration:none;font-weight:600;
        padding:12px 20px;border-radius:4px}
  @media (prefers-color-scheme:dark){a.btn{color:#06201D}}
  a.plain{color:var(--petrol)}
  /* Signet mit Jahreszeile, gleiche Fassung wie auf der Startseite */
  .signet-jahr{width:86px;margin:0 auto 26px;padding:9px 8px 8px;
    border:1px solid rgba(14,111,104,.8);
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .signet-jahr .mark{width:36px;height:36px;margin:0}
  .sj-linie{width:34px;height:1px;background:rgba(128,140,155,.4)}
  .sj-jahr{font-family:"Source Serif 4","Source Serif Fallback",Georgia,serif;font-size:9px;
    font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted,#5C6B7E);line-height:1;white-space:nowrap}
  .recht{margin-top:40px;font-size:var(--fs-1)}
  .recht a{color:var(--muted);margin-right:16px}
</style>
</head>
<body>
  <div class="box">
    <div class="signet-jahr" aria-hidden="true">
      <span class="mark"></span>
      <span class="sj-linie"></span>
      <span class="sj-jahr">Seit 2026</span>
    </div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Wahrscheinlich ein alter Link. Zurück zur Startseite — oder direkt zum Besetzungscheck, wenn Sie den gesucht haben.</p>
    <p><a class="btn" href="/">Zur Startseite</a> &nbsp; <a class="plain" href="/besetzungscheck/">Besetzungscheck</a></p>
    <p class="recht"><a href="/impressum/">Impressum</a><a href="/datenschutz/">Datenschutz</a></p>
  </div>
</body>
</html>
