<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden · Vertriebsköpfe</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
  :root{--paper:#F6F8FB;--ink:#14202F;--muted:#5C6B7E;--navy:#0D1A2E;--petrol:#0E6F68}
  @media (prefers-color-scheme:dark){:root{--paper:#0B1420;--ink:#E7EDF3;--muted:#93A3B4;--navy:#060E18;--petrol:#5FD3C4}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
       font-family:"Libre Franklin",Arial,sans-serif;font-size:17px;line-height:1.6;padding:32px}
  .box{max-width:520px;text-align:left}
  .mark{width:44px;height:44px;border-radius:3px;background:var(--navy);color:#fff;display:grid;place-items:center;
        font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:18px;margin-bottom:26px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:2rem;line-height:1.15;margin:0 0 14px}
  p{color:var(--muted);margin:0 0 24px}
  a.btn{display:inline-block;background:var(--petrol);color:#fff;text-decoration:none;font-weight:600;
        padding:12px 20px;border-radius:4px}
  @media (prefers-color-scheme:dark){a.btn{color:#06201D}}
  a.plain{color:var(--petrol)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">VK</div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Wahrscheinlich ein alter Link. Zurück zur Startseite — oder direkt zum Besetzungscheck, wenn Sie den gesucht haben.</p>
    <p><a class="btn" href="/">Zur Startseite</a> &nbsp; <a class="plain" href="/besetzungscheck/">Besetzungscheck</a></p>
  </div>
</body>
</html>
