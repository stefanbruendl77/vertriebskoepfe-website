# Variante B: GitHub bleibt Versionsverwaltung, gehostet wird auf dem
# STRATO-Webspace (Server in Deutschland). Diese Datei erst aktivieren,
# wenn die drei Secrets im Repository hinterlegt sind:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   FTP_SERVER    z. B. ftp.strato.de
#   FTP_USERNAME  der FTP-Benutzer aus dem STRATO-Kundenlogin
#   FTP_PASSWORD  das FTP-Passwort
#
# Solange die Seite über GitHub Pages läuft, kann die Datei liegen bleiben —
# ohne Secrets tut der Workflow nichts.

name: Deploy zu STRATO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
