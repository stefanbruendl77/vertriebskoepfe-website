<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Source Serif 4";src:url(../fonts/source-serif-4-latin.woff2)format("woff2");font-weight:400 700;font-display:block}
@font-face{font-family:"Libre Franklin";src:url(../fonts/libre-franklin-latin.woff2)format("woff2");font-weight:400 600;font-display:block}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0D1A2E;color:#EEF3F8;
 font-family:"Libre Franklin",sans-serif;display:flex;flex-direction:column;
 justify-content:space-between;padding:64px 72px}
.top{display:flex;align-items:center;gap:16px}
.mark{width:52px;height:52px;background:#F6F8FB;color:#0D1A2E;
 font-family:"Source Serif 4",serif;font-weight:600;font-size:22px;
 display:grid;place-items:center}
.name{font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:"Source Serif 4",serif;font-weight:600;font-size:66px;
 line-height:1.14;letter-spacing:-.015em;max-width:1010px}
h1 em{font-style:normal;color:#5FD3C4}
.foot{display:flex;justify-content:space-between;align-items:baseline;
 border-top:1px solid #22344E;padding-top:22px;font-size:21px;color:#93A6BC}
.foot b{color:#EEF3F8;font-weight:600}
</style></head><body>
<div class="top"><div class="mark">VK</div><div class="name">Vertriebsköpfe</div></div>
<h1>Wir besetzen Ihre Vertriebsstelle.<br><em>Und zwar so, dass der Nächste bleibt.</em></h1>
<div class="foot"><span>Vakanzdiagnose vor der Suche · Preise stehen auf der Seite</span><b>vertriebskoepfe.de</b></div>
</body></html>
